<div class="space-y-8 animate-fade-in p-6">
    <!-- Header Actions -->
    <app-page-header title="Workforce Management"
        subtitle="Manage and view your entire employee database."></app-page-header>

    <div class="flex justify-end -mt-20 relative z-10 mb-12">
        <button mat-flat-button color="primary" (click)="openAddDialog()"
            class="!h-12 !px-8 !rounded-xl !font-black !shadow-lg !shadow-primary-600/20 group">
            <mat-icon class="mr-2">add</mat-icon>
            Add New Employee
        </button>
    </div>

    <!-- Filters Bar -->
    <mat-card class="p-4 border-0 shadow-sm flex flex-col md:flex-row gap-6 items-center bg-white rounded-2xl">
        <div class="relative flex-1 group w-full">
            <mat-icon
                class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary-600 transition-colors">search</mat-icon>
            <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearch()"
                placeholder="Search by name, email, or employee code..."
                class="w-full pl-12 pr-6 py-3 bg-slate-50 border-0 rounded-xl focus:ring-2 focus:ring-primary-600/10 focus:bg-white outline-none transition-all text-sm font-medium">
        </div>

        <div class="flex items-center gap-4 w-full md:w-auto">
            <mat-form-field appearance="outline" class="w-full md:w-64 p-1">
                <mat-label>Department</mat-label>
                <mat-select [(ngModel)]="selectedDept" (selectionChange)="onFilter()">
                    <mat-option value="">All Departments</mat-option>
                    <mat-option *ngFor="let dept of departments()" [value]="dept.id">{{ dept.name }}</mat-option>
                </mat-select>
            </mat-form-field>

            <button mat-stroked-button color="primary" (click)="resetFilters()"
                class="!h-12 !rounded-xl !border-slate-200">
                Reset
            </button>
        </div>
    </mat-card>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        <ng-container *ngIf="!isLoading(); else skeletons">
            <mat-card *ngFor="let emp of employees()" [routerLink]="['/employees', emp.id]"
                class="employee-card rounded-3xl border-0 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all duration-500 overflow-hidden group cursor-pointer bg-white">
                <!-- Status indicator bar -->
                <div [class]="'h-1.5 ' + (emp.isActive ? 'bg-green-500' : 'bg-red-500')"></div>

                <div class="p-8">
                    <div class="flex items-start justify-between mb-6">
                        <div
                            class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center text-primary-600 font-black text-2xl border border-slate-100 group-hover:bg-primary-600 group-hover:text-white transition-all duration-300 shadow-sm">
                            {{ emp.fullName.charAt(0) }}
                        </div>
                        <button mat-icon-button (click)="$event.stopPropagation()" [matMenuTriggerFor]="empMenu"
                            class="text-slate-300 hover:text-slate-900 transition-colors">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                        <mat-menu #empMenu="matMenu">
                            <button mat-menu-item [routerLink]="['/employees', emp.id]">
                                <mat-icon>visibility</mat-icon>
                                <span>View Details</span>
                            </button>
                            <button mat-menu-item class="text-red-600">
                                <mat-icon class="text-red-500">delete_outline</mat-icon>
                                <span>Delete</span>
                            </button>
                        </mat-menu>
                    </div>

                    <h3 class="text-xl font-bold text-slate-900 group-hover:text-primary-600 transition-colors mb-1">{{
                        emp.fullName }}</h3>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">{{ emp.employeeCode
                        }}</p>

                    <div class="space-y-4">
                        <div class="flex items-center gap-3 text-sm text-slate-600">
                            <div
                                class="w-8 h-8 rounded-lg bg-primary-50 flex items-center justify-center text-primary-600">
                                <mat-icon class="text-lg">business_center</mat-icon>
                            </div>
                            <span class="font-bold truncate">{{ emp.designation }}</span>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-slate-600">
                            <div
                                class="w-8 h-8 rounded-lg bg-accent-50 flex items-center justify-center text-accent-700">
                                <mat-icon class="text-lg">domain</mat-icon>
                            </div>
                            <span class="font-bold">{{ emp.department }}</span>
                        </div>
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-50 flex items-center justify-between">
                        <app-status-chip [label]="emp.isActive ? 'Active' : 'Inactive'"
                            [type]="emp.isActive ? 'success' : 'error'"></app-status-chip>
                        <div
                            class="flex items-center gap-1.5 text-xs font-black text-slate-400 uppercase tracking-wider">
                            <mat-icon class="text-sm">schedule</mat-icon>
                            {{ emp.currentShift || 'General' }}
                        </div>
                    </div>
                </div>
            </mat-card>

            <app-empty-state *ngIf="employees().length === 0" icon="person_search"
                title="No employees match your search"
                description="Try broadening your filters or checking for typos in the name.">
            </app-empty-state>
        </ng-container>

        <!-- Loading State -->
        <ng-template #skeletons>
            <mat-card *ngFor="let i of [1,2,3,4,5,6,7,8]"
                class="rounded-3xl border-0 shadow-sm p-8 bg-white overflow-hidden">
                <div class="flex justify-between mb-6">
                    <app-loading-skeleton width="64px" height="64px" borderRadius="16px"></app-loading-skeleton>
                    <app-loading-skeleton width="24px" height="24px"></app-loading-skeleton>
                </div>
                <app-loading-skeleton width="70%" height="20px" class="mb-2"></app-loading-skeleton>
                <app-loading-skeleton width="40%" height="12px" class="mb-6"></app-loading-skeleton>
                <div class="space-y-4">
                    <app-loading-skeleton width="100%" height="32px" borderRadius="8px"></app-loading-skeleton>
                    <app-loading-skeleton width="100%" height="32px" borderRadius="8px"></app-loading-skeleton>
                </div>
                <div class="mt-8 pt-6 border-t border-slate-50 flex justify-between">
                    <app-loading-skeleton width="60px" height="20px" borderRadius="10px"></app-loading-skeleton>
                    <app-loading-skeleton width="80px" height="12px"></app-loading-skeleton>
                </div>
            </mat-card>
        </ng-template>
    </div>
</div>
