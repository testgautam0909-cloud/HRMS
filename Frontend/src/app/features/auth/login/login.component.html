<div class="min-h-screen flex items-center justify-center p-6 bg-slate-50 relative overflow-hidden">
    <!-- Subtle background pattern -->
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none"
        style="background-image: radial-gradient(#6366f1 1px, transparent 1px); background-size: 32px 32px;"></div>

    <div class="w-full max-w-md animate-slide-up relative z-10">
        <mat-card class="p-10 border-0 shadow-2xl rounded-3xl">
            <div class="text-center mb-10">
                <div
                    class="w-20 h-20 bg-primary-600 rounded-2xl flex items-center justify-center text-white mx-auto shadow-xl shadow-primary-200 mb-8">
                    <mat-icon class="text-4xl w-10 h-10 leading-none">corporate_fare</mat-icon>
                </div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">HRMS Pro</h1>
                <p class="text-slate-500 mt-2 font-medium">Sign in to your workplace portal</p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
                <!-- Email Field -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Email Address</label>
                    <mat-form-field appearance="outline" class="w-full">
                        <mat-icon matPrefix class="mr-2 text-slate-400">mail_outline</mat-icon>
                        <input matInput formControlName="email" type="email" placeholder="name@company.com"
                            autocomplete="email">
                        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
                        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Invalid email address</mat-error>
                    </mat-form-field>
                </div>

                <!-- Password Field -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between px-1">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Password</label>
                        <a routerLink="/forgot-password"
                            class="text-xs font-bold text-primary-600 hover:underline">Forgot?</a>
                    </div>
                    <mat-form-field appearance="outline" class="w-full">
                        <mat-icon matPrefix class="mr-2 text-slate-400">lock_outline</mat-icon>
                        <input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'"
                            placeholder="••••••••" autocomplete="current-password">
                        <button type="button" mat-icon-button matSuffix (click)="togglePassword()">
                            <mat-icon class="text-slate-400">{{ hidePassword() ? 'visibility_off' : 'visibility'
                                }}</mat-icon>
                        </button>
                        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is
                            required</mat-error>
                    </mat-form-field>
                </div>

                <!-- Feedback Banners -->
                <div *ngIf="error()"
                    class="p-4 bg-red-50 text-red-700 rounded-2xl text-sm font-bold flex items-center gap-3 border border-red-100 animate-shake">
                    <mat-icon class="text-red-500">error_outline</mat-icon>
                    <span>{{ error() }}</span>
                </div>

                <div *ngIf="success()"
                    class="p-4 bg-green-50 text-green-700 rounded-2xl text-sm font-bold flex items-center gap-3 border border-green-100 animate-fade-in">
                    <mat-icon class="text-green-500">check_circle_outline</mat-icon>
                    <span>{{ success() }}</span>
                </div>

                <!-- Submit Button -->
                <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading()"
                    class="w-full h-14 rounded-2xl shadow-lg shadow-primary-200 mt-6 font-bold text-lg overflow-hidden relative">
                    <span *ngIf="!isLoading()" class="flex items-center justify-center gap-2">
                        Sign In
                        <mat-icon>arrow_forward</mat-icon>
                    </span>
                    <span *ngIf="isLoading()" class="flex items-center justify-center gap-2">
                        <span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                        Authenticating...
                    </span>
                </button>
            </form>

            <div class="mt-10 text-center">
                <p class="text-slate-500 text-sm font-medium">
                    New employee?
                    <a href="mailto:hr@company.com" class="text-primary-600 font-bold hover:underline">Contact HR</a>
                </p>
            </div>
        </mat-card>
    </div>
</div>
